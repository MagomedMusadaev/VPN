version: '3.3'

services:
  bot-vpn:
    build:
      context: ..  # Контекст сборки — корень проекта
      dockerfile: docker/Dockerfile  # Путь к Dockerfile
    container_name: bot-vpn
    ports:
      - "8080:8080"  # Если приложение использует HTTP-сервер
    environment:
      - BOT_TOKEN
      - API_URL
      - PORT
      - POSTGRES_HOST
      - POSTGRES_NAME
      - POSTGRES_PASS
      - POSTGRES_PORT
      - POSTGRES_USER
      - REDIS_ADDR
      - REDIS_DB
      - REDIS_PASS
      - SERVER_IP
      - GO_ENV=production
    command: ["./main"]  # Запуск Go-приложения

#Если переменные окружения отсутствуют — значит, docker-compose их не получил. В этом случае попробуй заменить environment:
#environment:
  #BOT_TOKEN: ${BOT_TOKEN}
  #API_URL: ${API_URL}
  #...