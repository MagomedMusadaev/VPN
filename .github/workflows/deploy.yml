name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh -o ServerAliveInterval=60 -o StrictHostKeyChecking=no root@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/VPN
            git reset --hard
            git pull origin main
            docker-compose down
            docker system prune -af

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" > .env
            echo "API_URL=${{ secrets.API_URL }}" >> .env
            echo "REDIS_ADDR=${{ secrets.REDIS_ADDR }}" >> .env
            echo "REDIS_PASS=${{ secrets.REDIS_PASS }}" >> .env
            echo "REDIS_DB=${{ secrets.REDIS_DB }}" >> .env
            echo "POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}" >> .env
            echo "POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}" >> .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASS=${{ secrets.POSTGRES_PASS }}" >> .env
            echo "POSTGRES_NAME=${{ secrets.POSTGRES_NAME }}" >> .env
            echo "PORT=${{ secrets.PORT }}" >> .env

            docker-compose -f docker-compose.yml up --build -d
          EOF
