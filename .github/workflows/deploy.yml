name: Deploy to Server

on:
  push:
    branches:
      - main  # Запуск при пуше в main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/VPN
            git reset --hard
            git pull origin main
            docker-compose down

            # Экспорт переменных окружения
            export BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            export API_URL=${{ secrets.API_URL }}
            export PORT=${{ secrets.PORT }}
            export POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            export POSTGRES_NAME=${{ secrets.POSTGRES_NAME }}
            export POSTGRES_PASS=${{ secrets.POSTGRES_PASS }}
            export POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            export POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            export REDIS_ADDR=${{ secrets.REDIS_ADDR }}
            export REDIS_DB=${{ secrets.REDIS_DB }}
            export REDIS_PASS=${{ secrets.REDIS_PASS }}
            export SERVER_IP=${{ secrets.SERVER_IP }}

            # Запуск контейнеров с переменными окружения
            docker-compose -f docker/docker-compose.yml up --build -d
