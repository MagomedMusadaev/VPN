name: Deploy to Server

on:
  push:
    branches:
      - main  # Workflow запускается только при push в ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонируем код репозитория
      - name: Checkout code
        uses: actions/checkout@v2

      # Шаг 2: Настраиваем SSH для подключения к серверу
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Шаг 3: Деплой на сервер через SSH
      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/VPN
            git reset --hard
            git pull origin main
            docker-compose down
            docker system prune -af
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            export BOT_TOKEN="${{ secrets.BOT_TOKEN }}"
            export API_URL="${{ secrets.API_URL }}"
            export REDIS_ADDR="${{ secrets.REDIS_ADDR }}"
            export REDIS_PASS="${{ secrets.REDIS_PASS }}"
            export REDIS_DB="${{ secrets.REDIS_DB }}"
            export POSTGRES_HOST="${{ secrets.POSTGRES_HOST }}"
            export POSTGRES_PORT="${{ secrets.POSTGRES_PORT }}"
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            export POSTGRES_PASS="${{ secrets.POSTGRES_PASS }}"
            export POSTGRES_NAME="${{ secrets.POSTGRES_NAME }}"
            export PORT="${{ secrets.PORT }}"

            docker-compose -f docker/docker-compose.yml up --build -d
          EOF
