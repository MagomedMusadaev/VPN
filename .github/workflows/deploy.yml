name: Deploy to Server

on:
  push:
    branches:
      - main  # Workflow запускается только при push в ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонируем код репозитория
      - name: Checkout code
        uses: actions/checkout@v2

      # Шаг 2: Настраиваем SSH для подключения к серверу
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Шаг 3: Деплой на сервер через SSH
      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.SERVER_IP }}<< 'EOF'
            cd /root/VPN
            git reset --hard
            git pull origin main
            docker-compose down
            docker system prune -af
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            BOT_TOKEN=${{ secrets.BOT_TOKEN }} 
            API_URL=${{ secrets.API_URL }} 
            REDIS_ADDR=${{ secrets.REDIS_ADDR }} 
            REDIS_PASS=${{ secrets.REDIS_PASS }} 
            REDIS_DB=${{ secrets.REDIS_DB }} 
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }} 
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }} 
            POSTGRES_USER=${{ secrets.POSTGRES_USER }} 
            POSTGRES_PASS=${{ secrets.POSTGRES_PASS }} 
            POSTGRES_NAME=${{ secrets.POSTGRES_NAME }} 
            PORT=${{ secrets.PORT }} 
            docker-compose -f docker/docker-compose.yml up --build -d
          EOF
